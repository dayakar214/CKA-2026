apiVersion: apps/v1
kind: Deployment
metadata:
  name: entitydataservice-deploy
  namespace: platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: entitydataservice
  template:
    metadata:
      labels:
        app: entitydataservice
    spec:
      containers:
      - name: entitydataservice
        image: nginx:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: entitydataservice-svc
  namespace: platform
spec:
  selector:
    app: entitydataservice
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 80